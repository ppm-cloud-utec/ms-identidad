service: ms-identidad

# Se usa la v3 a proposito: la v4 exige una cuenta de serverless.com y un
# SERVERLESS_ACCESS_KEY para cada deploy. La v3 solo necesita credenciales
# de AWS, que es lo unico que da el Learner Lab.
frameworkVersion: "3"

provider:
  name: aws
  # Usa la API Gateway unica de infra-compartida en vez de crear una
  # propia. Todas las rutas de este servicio viven bajo /identidad.
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    TABLA: ${self:service}-identidad-${sls:stage}
    # Este microservicio FIRMA los tokens, asi que necesita el mismo secreto
    # que el authorizer compartido usa para verificarlos.
    # El NOMBRE del secreto, no su valor. Ver src/secretos.py.
    JWT_SECRET_NOMBRE: ppm/jwt-secret
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:PutItem
  #       Resource: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesadosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:Query
  #         - dynamodb:GetItem
  #         - dynamodb:PutItem
  #         - dynamodb:UpdateItem
  #         - dynamodb:DeleteItem
  #         - dynamodb:BatchWriteItem
  #       Resource:
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-identidad-${sls:stage}
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-identidad-${sls:stage}/index/*
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    # true, no "non-linux": en Linux "non-linux" NO usa Docker y busca un
    # binario python3.12 local, que no existe (el sistema trae 3.14).
    # Forzar Docker ademas garantiza que psycopg se compile contra Amazon
    # Linux, que es donde corre la Lambda.
    dockerizePip: true
    slim: true
    # Cache propio por repo. El cache global de ~/.cache lo comparten todos
    # los servicios, y si dos despliegues corren a la vez un contenedor lo
    # deja en root:root mientras el otro lo lee -> EACCES.
    cacheLocation: ./.serverless-cache
  autorizador:
    # Registrado una sola vez en la API compartida (infra-compartida).
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  # ---------- Publicos (sin authorizer) ----------

  login:
    handler: src/handlers/login.manejar
    description: Emite el JWT con el tenant_id dentro
    events:
      - http:
          path: "/identidad/login"
          method: post
          cors: true

  tenants:
    handler: src/handlers/tenants.manejar
    description: Lista las organizaciones para el selector del login
    events:
      - http:
          path: "/identidad/tenants"
          method: get
          cors: true

  # ---------- Protegidos por el authorizer compartido ----------

  health:
    handler: src/handlers/health.manejar
    events:
      - http:
          path: "/identidad/health"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  perfil:
    handler: src/handlers/perfil.manejar
    description: Datos del usuario dueno del token
    events:
      - http:
          path: "/identidad/perfil"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  crearUsuario:
    handler: src/handlers/usuarios.crear
    events:
      - http:
          path: "/identidad/usuarios"
          method: post
          cors: true
          authorizer: ${self:custom.autorizador}

  listarUsuarios:
    handler: src/handlers/usuarios.listar
    events:
      - http:
          path: "/identidad/usuarios"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  obtenerUsuario:
    handler: src/handlers/usuarios.obtener
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  actualizarUsuario:
    handler: src/handlers/usuarios.actualizar
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: put
          cors: true
          authorizer: ${self:custom.autorizador}

  desactivarUsuario:
    handler: src/handlers/usuarios.desactivar
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: delete
          cors: true
          authorizer: ${self:custom.autorizador}

  # ---------- Aprovisionamiento de tenants ----------
  # Sin evento http: las invoca la maquina de estados
  # ppm-aprovisionar-tenant. Dar de alta una organizacion es una operacion
  # de plataforma, no una operacion de negocio dentro de un tenant.
  aprovisionarTenant:
    handler: src/handlers/aprovisionar.aprovisionar
    name: ms-identidad-${sls:stage}-aprovisionarTenant
    description: Registra el tenant y crea su administrador
    timeout: 30

  compensarTenant:
    handler: src/handlers/aprovisionar.compensar
    name: ms-identidad-${sls:stage}-compensarTenant
    description: "Rollback del alta: borra el admin y el registro del tenant"
    timeout: 30


resources:
  Resources:
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-identidad-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          # pk = TENANT#<tenant_id>  -> el aislamiento vive en la particion
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE


