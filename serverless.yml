service: ms-identidad

frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    TABLA: ${self:service}-identidad-${sls:stage}
  # AWS Academy no permite crear roles IAM: se reusa LabRole.
  # En una cuenta propia, borra la linea `role:` y descomenta los permisos,
  # que son los minimos que este microservicio necesita.
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
    # role:
    #   statements:
  #     - Effect: Allow
  #       Action:
  #         - sns:Publish
  #       Resource: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:PutItem
  #       Resource: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesadosArn}
  #     - Effect: Allow
  #       Action:
  #         - dynamodb:Query
  #         - dynamodb:GetItem
  #         - dynamodb:PutItem
  #         - dynamodb:UpdateItem
  #         - dynamodb:DeleteItem
  #         - dynamodb:BatchWriteItem
  #       Resource:
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-identidad-${sls:stage}
  #         - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-identidad-${sls:stage}/index/*
  #
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
  autorizador:
    # El authorizer vive en infra-compartida y lo comparten los 6 microservicios
    name: autorizadorCompartido
    type: request
    arn: ${cf:infra-compartida-${sls:stage}.AutorizadorArn}
    resultTtlInSeconds: 300
    identitySource: method.request.header.Authorization

functions:

  # ---------- Publicos (sin authorizer) ----------

  login:
    handler: src/handlers/login.manejar
    description: Emite el JWT con el tenant_id dentro
    events:
      - http:
          path: /login
          method: post
          cors: true

  tenants:
    handler: src/handlers/tenants.manejar
    description: Lista las organizaciones para el selector del login
    events:
      - http:
          path: /tenants
          method: get
          cors: true

  # ---------- Protegidos por el authorizer compartido ----------

  health:
    handler: src/handlers/health.manejar
    events:
      - http:
          path: /health
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  perfil:
    handler: src/handlers/perfil.manejar
    description: Datos del usuario dueno del token
    events:
      - http:
          path: /perfil
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  crearUsuario:
    handler: src/handlers/usuarios.crear
    events:
      - http:
          path: /usuarios
          method: post
          cors: true
          authorizer: ${self:custom.autorizador}

  listarUsuarios:
    handler: src/handlers/usuarios.listar
    events:
      - http:
          path: /usuarios
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  obtenerUsuario:
    handler: src/handlers/usuarios.obtener
    events:
      - http:
          path: /usuarios/{email}
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  actualizarUsuario:
    handler: src/handlers/usuarios.actualizar
    events:
      - http:
          path: /usuarios/{email}
          method: put
          cors: true
          authorizer: ${self:custom.autorizador}

  desactivarUsuario:
    handler: src/handlers/usuarios.desactivar
    events:
      - http:
          path: /usuarios/{email}
          method: delete
          cors: true
          authorizer: ${self:custom.autorizador}

resources:
  Resources:
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-identidad-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          # pk = TENANT#<tenant_id>  -> el aislamiento vive en la particion
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
