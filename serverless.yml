service: ms-identidad

frameworkVersion: "3"

provider:
  name: aws
  apiGateway:
    restApiId: ${cf:infra-compartida-${sls:stage}.ApiId}
    restApiRootResourceId: ${cf:infra-compartida-${sls:stage}.ApiRootResourceId}
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, "dev"}
  memorySize: 512
  timeout: 29
  architecture: x86_64
  environment:
    SERVICIO: ${self:service}
    SNS_TOPIC_ARN: ${cf:infra-compartida-${sls:stage}.SnsEventosArn}
    TABLA_EVENTOS_PROCESADOS: ${cf:infra-compartida-${sls:stage}.TablaEventosProcesados}
    TABLA: ${self:service}-identidad-${sls:stage}
    JWT_SECRET_NOMBRE: ppm/jwt-secret
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
package:
  individually: false
  patterns:
    - "!**"
    - "src/**"

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    slim: true
    cacheLocation: ./.serverless-cache
  autorizador:
    type: CUSTOM
    authorizerId: ${cf:infra-compartida-${sls:stage}.AutorizadorApiId}

functions:

  # ---------- Publicos (sin authorizer) ----------

  login:
    handler: src/handlers/login.manejar
    description: Emite el JWT con el tenant_id dentro
    events:
      - http:
          path: "/identidad/login"
          method: post
          cors: true

  tenants:
    handler: src/handlers/tenants.manejar
    description: Lista las organizaciones para el selector del login
    events:
      - http:
          path: "/identidad/tenants"
          method: get
          cors: true


  health:
    handler: src/handlers/health.manejar
    events:
      - http:
          path: "/identidad/health"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  perfil:
    handler: src/handlers/perfil.manejar
    description: Datos del usuario dueno del token
    events:
      - http:
          path: "/identidad/perfil"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  crearUsuario:
    handler: src/handlers/usuarios.crear
    events:
      - http:
          path: "/identidad/usuarios"
          method: post
          cors: true
          authorizer: ${self:custom.autorizador}

  listarUsuarios:
    handler: src/handlers/usuarios.listar
    events:
      - http:
          path: "/identidad/usuarios"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  obtenerUsuario:
    handler: src/handlers/usuarios.obtener
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: get
          cors: true
          authorizer: ${self:custom.autorizador}

  actualizarUsuario:
    handler: src/handlers/usuarios.actualizar
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: put
          cors: true
          authorizer: ${self:custom.autorizador}

  desactivarUsuario:
    handler: src/handlers/usuarios.desactivar
    events:
      - http:
          path: "/identidad/usuarios/{email}"
          method: delete
          cors: true
          authorizer: ${self:custom.autorizador}

  aprovisionarTenant:
    handler: src/handlers/aprovisionar.aprovisionar
    name: ms-identidad-${sls:stage}-aprovisionarTenant
    description: Registra el tenant y crea su administrador
    timeout: 30

  compensarTenant:
    handler: src/handlers/aprovisionar.compensar
    name: ms-identidad-${sls:stage}-compensarTenant
    description: "Rollback del alta: borra el admin y el registro del tenant"
    timeout: 30


resources:
  Resources:
    Tabla:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-identidad-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE

